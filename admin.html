<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Na Brasa Burger · Admin</title>
<meta name="theme-color" content="#120c0a">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Alfa+Slab+One&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#fff4cf;--surface:#fffdf5;--ink:#1c1411;--muted:#6f6058;--line:#e8d9a8;--chip:#f6e7b0;
  --brand:#ffc400;--brand-ink:#1c1411;--fire:#d62828;--ok:#1b8a4b;--head:#120c0a;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--bg:#160f0c;--surface:#241a16;--ink:#fff1cf;--muted:#b9a58f;--line:#3a2b24;--chip:#33251f}
}
:root[data-theme="dark"]{--bg:#160f0c;--surface:#241a16;--ink:#fff1cf;--muted:#b9a58f;--line:#3a2b24;--chip:#33251f}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Barlow',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:16px;line-height:1.35;-webkit-tap-highlight-color:transparent}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
:focus-visible{outline:3px solid var(--fire);outline-offset:2px}
h1,h2,h3,h4,p{margin:0}
.disp{font-family:'Alfa Slab One',Georgia,serif;font-weight:400;letter-spacing:.2px}

/* cabeçalho */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--head);border-bottom:4px solid var(--brand);display:flex;align-items:center;gap:12px;padding:8px 14px}
.top img{width:46px;height:46px;border-radius:50%;flex:none}
.sair{margin-left:auto;color:var(--brand);border:1.5px solid var(--brand);border-radius:99px;padding:6px 12px;font-weight:700;font-size:14px;min-height:36px;white-space:nowrap}
.top .nm{font-family:'Alfa Slab One',Georgia,serif;color:var(--brand);font-size:20px;line-height:1}
.top .sb{color:#e9d9b6;font-size:13px;margin-top:3px}

.main{padding:16px 14px 120px;max-width:720px;margin:0 auto}
.main>h1{font-size:26px;font-family:'Alfa Slab One',Georgia,serif;font-weight:400}
.sub{color:var(--muted);font-size:14px;margin-top:2px}

/* navegação */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--head);display:flex;padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px));gap:6px;border-top:1px solid #000}
.nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 4px;border-radius:12px;color:#cdbb95;font-weight:600;font-size:13px;min-height:52px}
.nav button svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.nav button.on{background:var(--brand);color:var(--brand-ink)}

/* botões */
.btn{min-height:48px;padding:10px 16px;border-radius:12px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-align:center}
.btn.primary{background:var(--brand);color:var(--brand-ink)}
.btn.fire{background:var(--fire);color:#fff}
.btn.ghost{background:var(--chip);color:var(--ink)}
.btn.danger{color:var(--fire)}
.btn.block{width:100%}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn.sm{min-height:40px;padding:6px 12px;font-size:15px}

/* mesas */
.legend{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}
.pill{display:inline-flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--line);padding:6px 12px;border-radius:99px;font-weight:600;font-size:14px}
.dot{width:12px;height:12px;border-radius:50%;background:var(--ok)}
.dot.r{background:var(--fire)}
.mesas{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.mesa{aspect-ratio:1;border-radius:14px;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:2px}
.mesa b{font-family:'Alfa Slab One',Georgia,serif;font-weight:400;font-size:24px;line-height:1}
.mesa small{font-size:11px;font-weight:600;opacity:.95}
.mesa.free{background:var(--ok)}
.mesa.occ{background:var(--fire)}
@media (min-width:520px){.mesas{grid-template-columns:repeat(6,1fr)}}

/* pedido */
.otop{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.back{background:var(--chip);border-radius:12px;min-height:44px;padding:0 14px;font-weight:700}
.otop h1{font-family:'Alfa Slab One',Georgia,serif;font-weight:400;font-size:22px;line-height:1.1}
.seg{display:flex;background:var(--chip);border-radius:14px;padding:4px;gap:4px;margin-bottom:14px}
.seg button{flex:1;min-height:44px;border-radius:11px;font-weight:700}
.seg button.on{background:var(--brand);color:var(--brand-ink)}
.cnt{display:inline-block;min-width:22px;padding:0 6px;border-radius:99px;background:var(--fire);color:#fff;font-size:13px;margin-left:4px}
.grp{font-family:'Alfa Slab One',Georgia,serif;font-weight:400;font-size:17px;margin:16px 0 8px}
.prod{width:100%;text-align:left;display:flex;align-items:center;gap:12px;background:var(--surface);border:1.5px solid var(--line);border-radius:14px;padding:12px;margin-bottom:8px}
.prod .n{font-family:'Alfa Slab One',Georgia,serif;font-size:20px;color:var(--fire);width:30px;flex:none;text-align:center}
.prod .i{flex:1;min-width:0}
.prod .i b{display:block;font-size:18px}
.prod .i span{display:block;font-size:13px;color:var(--muted);margin-top:2px}
.prod .p{font-weight:700;font-size:17px;white-space:nowrap;background:var(--brand);color:var(--brand-ink);padding:6px 10px;border-radius:10px}
.line{width:100%;text-align:left;display:flex;gap:10px;background:var(--surface);border:1.5px solid var(--line);border-radius:14px;padding:12px;margin-bottom:8px}
.line .q{font-weight:700;min-width:30px}
.line .i{flex:1;min-width:0}
.line .i b{display:block}
.line .i span{display:block;font-size:13px;color:var(--muted)}
.line .v{font-weight:700;white-space:nowrap}
.sum{background:var(--surface);border:1.5px solid var(--line);border-radius:14px;padding:12px;margin-top:12px}
.sum div{display:flex;justify-content:space-between;padding:4px 0}
.sum .tt{border-top:1.5px dashed var(--line);margin-top:6px;padding-top:10px;font-family:'Alfa Slab One',Georgia,serif;font-size:20px}
.obar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--head);color:#fff;display:flex;align-items:center;gap:12px;padding:10px 14px calc(10px + env(safe-area-inset-bottom,0px))}
.obar .t{flex:1}
.obar small{display:block;color:#cdbb95;font-size:13px}
.obar b{font-family:'Alfa Slab One',Georgia,serif;font-weight:400;font-size:22px;color:var(--brand)}
.empty{text-align:center;color:var(--muted);padding:28px 10px;border:2px dashed var(--line);border-radius:14px}

/* delivery */
.srow{display:flex;gap:8px;margin:14px 0}
.in{width:100%;min-height:48px;border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:8px 12px}
.srow .in{flex:1}
.card{background:var(--surface);border:1.5px solid var(--line);border-radius:14px;padding:12px;margin-bottom:10px}
.card h3{font-size:18px}
.card .ad{color:var(--muted);font-size:14px;margin-top:2px}
.card .ult{font-size:13px;margin-top:8px;padding:8px 10px;background:var(--chip);border-radius:10px}
.card .acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.tag{display:inline-block;background:var(--fire);color:#fff;font-size:12px;font-weight:700;padding:2px 8px;border-radius:99px;margin-left:6px;vertical-align:middle}
.taxa{display:inline-block;background:var(--brand);color:var(--brand-ink);font-size:12px;font-weight:700;padding:2px 8px;border-radius:99px}

/* caixa */
.dnav{display:flex;align-items:center;gap:8px;margin:12px 0}
.dnav .d{flex:1;text-align:center;font-weight:700;text-transform:capitalize}
.hero{background:var(--head);color:#fff;border-radius:18px;padding:16px;margin-bottom:12px;border-bottom:5px solid var(--brand)}
.hero small{color:#cdbb95}
.hero .big{font-family:'Alfa Slab One',Georgia,serif;font-size:38px;color:var(--brand);line-height:1.1;margin-top:4px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
.box{background:var(--surface);border:1.5px solid var(--line);border-radius:14px;padding:12px}
.box small{color:var(--muted);display:block}
.box b{font-family:'Alfa Slab One',Georgia,serif;font-weight:400;font-size:20px;display:block;margin-top:2px}
.box p{font-size:13px;color:var(--muted);margin-top:2px}
.kv{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line)}
.kv:last-child{border-bottom:0}
.row{width:100%;display:flex;align-items:center;gap:10px;text-align:left;background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:6px}
.row .t{font-weight:700;color:var(--muted);width:46px;flex:none}
.row .w{flex:1;min-width:0}
.row .w b{display:block}
.row .w small{display:block;color:var(--muted)}
.row .v{font-weight:700;white-space:nowrap}
.warn{background:#ffe0dc;color:#7a1410;border-radius:12px;padding:10px 12px;margin-bottom:10px;font-weight:600}
.okb{background:#d9f3e2;color:#0e5a2e;border-radius:12px;padding:10px 12px;margin-bottom:10px;font-weight:600}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .warn{background:#4a1c18;color:#ffd9d4}:root:not([data-theme="light"]) .okb{background:#15382a;color:#c8f0d8}}
:root[data-theme="dark"] .warn{background:#4a1c18;color:#ffd9d4}
:root[data-theme="dark"] .okb{background:#15382a;color:#c8f0d8}
.lock{max-width:340px;margin:40px auto;text-align:center;display:grid;gap:12px}

/* sheet */
#sheet{position:fixed;inset:0;z-index:50}
.scrim{position:absolute;inset:0;background:rgba(0,0,0,.6)}
.panel{position:absolute;left:0;right:0;bottom:0;max-height:92%;overflow:auto;background:var(--bg);border-radius:22px 22px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px));max-width:720px;margin:0 auto}
.panel h4{font-family:'Alfa Slab One',Georgia,serif;font-weight:400;font-size:16px;margin:16px 0 8px}
.sh-head{display:flex;justify-content:space-between;align-items:center;gap:10px}
.sh-head h3{font-family:'Alfa Slab One',Georgia,serif;font-weight:400;font-size:22px}
.sh-head .price{font-weight:700;background:var(--brand);color:var(--brand-ink);padding:4px 10px;border-radius:10px}
.qty,.ex{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 0}
.ex small{display:block;color:var(--muted)}
.step{display:flex;align-items:center;gap:10px}
.step button{width:44px;height:44px;border-radius:12px;background:var(--chip);font-size:24px;font-weight:700}
.step b{min-width:24px;text-align:center;font-size:18px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:44px;padding:0 14px;border-radius:99px;background:var(--surface);border:1.5px solid var(--line);font-weight:600}
.chip.on{background:var(--fire);border-color:var(--fire);color:#fff}
.opt{flex:1;min-height:48px;border-radius:12px;background:var(--surface);border:1.5px solid var(--line);font-weight:700}
.opt.on{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.opts{display:flex;gap:8px}
.opt[disabled]{opacity:.4;cursor:not-allowed}
.foot{display:flex;gap:10px;margin-top:18px}
.foot .btn{flex:1}
.fld{display:grid;gap:4px;margin-top:12px}
.fld label{font-weight:600;font-size:14px}
.tot{font-family:'Alfa Slab One',Georgia,serif;font-size:30px;color:var(--fire);margin:6px 0}
.mh{margin:14px 0 6px;display:flex;justify-content:space-between;font-weight:700;text-transform:capitalize}
textarea.in{min-height:180px;font-size:14px}

#toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%) translateY(20px);background:#000;color:#fff;padding:10px 16px;border-radius:12px;z-index:60;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;max-width:88%;text-align:center;font-weight:600}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
@media (prefers-reduced-motion:reduce){#toast{transition:none}}

/* admin */
.bd{font-size:12px;font-weight:700;padding:3px 9px;border-radius:99px;align-self:flex-start;color:#fff;white-space:nowrap}
.bd.ok{background:var(--ok)}.bd.low{background:#9a5b00}.bd.out{background:var(--fire)}.bd.none{background:#6f6058}
.gcard{width:100%;text-align:left;background:var(--surface);border:2px solid var(--line);border-left-width:10px;border-radius:16px;padding:14px;margin-bottom:12px;display:flex;flex-direction:column;gap:6px}
.gcard.ok{border-left-color:var(--ok)}.gcard.low{border-left-color:#9a5b00}.gcard.out{border-left-color:var(--fire)}.gcard.none{border-left-color:#6f6058}
.gt{display:flex;justify-content:space-between;align-items:center;gap:8px}
.gt b{font-family:'Alfa Slab One',Georgia,serif;font-weight:400;font-size:22px}
.gn{font-family:'Alfa Slab One',Georgia,serif;font-size:52px;line-height:1}
.gs{color:var(--muted);font-size:14px}
.rowinfo{flex:1;min-width:0;display:flex;align-items:center;gap:10px;text-align:left}
a.sair{text-decoration:none;display:inline-flex;align-items:center}
.sair.b2{margin-left:0}
.top{gap:10px}
.top .nm{font-size:18px}
</style>
</head>

/* ---------- utilitários ---------- */
function $(s){return document.querySelector(s)}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function money(n){var p=(Math.round(n*100)/100).toFixed(2).split('.');return 'R$ '+p[0].replace(/\B(?=(\d{3})+(?!\d))/g,'.')+','+p[1]}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
function clone(o){return JSON.parse(JSON.stringify(o))}
function num(s){var n=parseFloat(String(s).replace(',','.'));return isNaN(n)?0:n}
function pad(n){return (n<10?'0':'')+n}
function fmtKey(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
/* dia de trabalho: vira às 6h da manhã, igual ao app de pedidos */
function dayKey(ts){return fmtKey(new Date(ts-6*3600*1000))}
function addDays(k,n){var d=new Date(k+'T12:00:00');d.setDate(d.getDate()+n);return fmtKey(d)}
function diaLabel(k){return new Date(k+'T12:00:00').toLocaleDateString('pt-BR',{weekday:'long',day:'numeric',month:'long'})}
function diaBr(k){var p=k.split('-');return p[2]+'/'+p[1]+'/'+p[0]}
function diaCurto(k){var p=k.split('-');return p[2]+'/'+p[1]}
function hora(ts){return new Date(ts).toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'})}
function nomeBonito(u){return u?u.charAt(0).toUpperCase()+u.slice(1):''}
function nomes(l){return (l||[]).map(nomeBonito).join(', ')}
function quemAtendeu(v){var l=(v.atendentes&&v.atendentes.length)?v.atendentes:(v.atendente?[v.atendente]:[]);return nomes(l)}
var tt;
function toast(m){var t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(tt);tt=setTimeout(function(){t.classList.remove('show')},2600)}
function rd(k){try{var r=localStorage.getItem(k);return r?JSON.parse(r):null}catch(e){return null}}
function wr(k,v){try{localStorage.setItem(k,JSON.stringify(v));return true}catch(e){toast('Não foi possível salvar neste aparelho');return false}}
function baixar(nome,texto){
  try{
    var b=new Blob([texto],{type:'application/json'}),a=document.createElement('a');
    a.href=URL.createObjectURL(b);a.download=nome;document.body.appendChild(a);a.click();a.remove();
    setTimeout(function(){URL.revokeObjectURL(a.href)},2000);return true;
  }catch(e){toast('Não foi possível baixar o arquivo');return false}
}
/* texto para impressora térmica */
function limpa(t){return String(t).replace(/×/g,'x').normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^\x20-\x7E\n]/g,'?')}
function wrapT(t,w){var out=[],cur='';String(t).split(' ').forEach(function(p){if(cur&&(cur+' '+p).length>w){out.push(cur);cur=p}else cur=cur?cur+' '+p:p});if(cur)out.push(cur);return out}
function lr(a,b,W){var sp=W-a.length-b.length;if(sp<1){a=a.slice(0,Math.max(1,W-b.length-1));sp=1}return a+Array(sp+1).join(' ')+b}
function ctr(t,W){var sp=Math.max(0,Math.floor((W-t.length)/2));return Array(sp+1).join(' ')+t}

/* leitura do app de pedidos (mesmo navegador, somente leitura) */
function ped(){var s=rd(K_PED)||{};return {vendas:s.vendas||[],mesas:s.mesas||{},cancelados:s.cancelados||[]}}
function todasVendas(){
  var p=ped(),ids={},out=[],canc={};
  p.cancelados.forEach(function(c){canc[c.id]=1});
  var ok=function(v){return !A.excluidos[v.id]&&!canc[v.id]&&(v.tipo==='mesa'||v.tipo==='delivery')};
  p.vendas.forEach(function(v){ids[v.id]=1;if(ok(v))out.push(v)});
  A.importadas.forEach(function(v){if(!ids[v.id]){ids[v.id]=1;if(ok(v))out.push(v)}});
  return out;
}
function listaCanc(dia){
  var out=[],seen={};
  ped().cancelados.forEach(function(c){
    if(c.dia===dia&&!seen[c.id]){seen[c.id]=1;out.push({id:c.id,ts:c.ts||c.cancelTs,tipo:c.tipo,mesa:c.mesa,cliente:c.cliente,total:c.total||0,motivo:c.motivo,por:c.cancelPor,aberto:c.aberto,origem:'app'})}
  });
  Object.keys(A.excluidos).forEach(function(id){
    var e=A.excluidos[id],v=e.venda||{};
    if(v.dia===dia&&!seen[id]){seen[id]=1;out.push({id:id,ts:v.ts,tipo:v.tipo,mesa:v.mesa,cliente:v.cliente,total:v.total||0,motivo:e.motivo,por:e.por||v.cancelPor,aberto:v.aberto,origem:'admin'})}
  });
  return out.sort(function(a,b){return a.ts-b.ts});
}
function lineTotal(i){return (i.preco+(i.extras||[]).reduce(function(s,e){return s+e.preco*e.qtd},0))*i.qtd}
function itemResumo(i){
  var t=i.qtd+'× '+i.nome;
  if(i.sem&&i.sem.length)t+=' (sem '+i.sem.map(function(x){return x.toLowerCase()}).join(', ')+')';
  if(i.extras&&i.extras.length)t+=' + '+i.extras.map(function(e){return (e.qtd>1?e.qtd+'× ':'')+e.nome.toLowerCase()}).join(', ');
  return t;
}
function formasTxt(v){var p=v.pagamentos;return p.map(function(x){return FORMA[x.forma]+(p.length>1?' '+money(x.valor):'')}).join(' + ')}

/* ---------- estoque por grupo ---------- */
function catDe(i){
  if(i.cat)return i.cat;
  var it=CFG.itens.filter(function(x){return x.id===i.id})[0];
  return it?it.cat:null;
}
function vendidoGrupo(dia){
  var m={lanche:0,porcao:0,bebida:0},soma=function(i){
    if(i.comp&&i.comp.length){i.comp.forEach(function(c){if(c.cat&&m[c.cat]!=null)m[c.cat]+=(c.qtd||1)*i.qtd});return}
    var c=catDe(i);if(c&&m[c]!=null)m[c]+=i.qtd};
  todasVendas().filter(function(v){return v.dia===dia}).forEach(function(v){v.itens.forEach(soma)});
  if(dia===dayKey(Date.now())){
    var ms=ped().mesas;
    Object.keys(ms).forEach(function(n){(ms[n].itens||[]).forEach(soma)});
  }
  return m;
}
function minGrupo(g){return A.estMin[g.k]!=null?A.estMin[g.k]:g.min}
function grupoInfo(g,dia,vend){
  var e=A.est[dia],ini=e?e[g.k]:null,v=vend[g.k]||0;
  if(ini==null)return {ini:null,vend:v,rest:null,cls:'none',txt:'Sem total'};
  var rest=ini-v;
  return {ini:ini,vend:v,rest:rest,cls:rest<=0?'out':rest<=minGrupo(g)?'low':'ok',txt:rest<=0?'Esgotado':rest<=minGrupo(g)?'Acabando':'Ok'};
}

function hashPw(salt,u,p){
  var d=new TextEncoder().encode(salt+':'+u+':'+p);
  return crypto.subtle.digest('SHA-256',d).then(function(b){return Array.prototype.map.call(new Uint8Array(b),function(x){return ('0'+x.toString(16)).slice(-2)}).join('')});
}
function temCripto(){return !!(window.crypto&&crypto.subtle)}

function drawSheet(){
  var el=$('#sheet');
  if(!sheetState){el.hidden=true;el.innerHTML='';document.body.style.overflow='';return}
  el.hidden=false;document.body.style.overflow='hidden';
  el.innerHTML='<div class="scrim" data-act="closeSheet"></div><div class="panel" role="dialog" aria-modal="true">'+sheetState.render()+'</div>';
}
function closeSheet(){sheetState=null;drawSheet()}

  openSheet({
    data:d,
    onInput:function(f){if(f==='ini'){var r=$('#erest');if(r)r.textContent=d.ini===''?'—':String(num(d.ini)-v)}},

      return '<div class="sh-head"><h3>'+g.nome+'</h3></div><p class="sub" style="margin-top:4px">Vendido no dia: '+v+'</p>'+

       '<div class="foot"><button class="btn ghost" data-act="closeSheet">Cancelar</button><button class="btn primary" data-act="ok">Salvar</button></div>';
    },
    act:{
      mais:function(x){d.ini=String(Math.max(0,Math.round(num(d.ini))+Number(x.n)));drawSheet()},
      ok:function(){
        A.est[ui.dia]=A.est[ui.dia]||{};
        if(String(d.ini).trim()==='')delete A.est[ui.dia][k];
        else A.est[ui.dia][k]=Math.max(0,Math.round(num(d.ini)));
        A.estMin[k]=Math.max(0,Math.round(num(d.min)));
        saveA();closeSheet();render();toast('Estoque salvo');
      }
    }
  });
}

/* ---------- promoção do dia ---------- */
function promoStatus(){
  var p=CFG.promo,hoje=dayKey(Date.now());
  if(!p||!p.nome)return {cls:'none',txt:'Nenhuma promoção configurada'};
  if(!p.ativa)return {cls:'none',txt:'Desligada · o cliente não vê'};
  if(p.data&&p.data<hoje)return {cls:'out',txt:'Expirada em '+diaBr(p.data)+' · o cliente não vê'};
  if(p.data&&p.data>hoje)return {cls:'low',txt:'Agendada para '+diaBr(p.data)};
  return {cls:'ok',txt:'No ar hoje · '+p.nome+' · '+money(p.preco)};
}
function promoCardAdm(){
  var st=promoStatus(),p=CFG.promo;
  return '<div class="box" style="margin:12px 0"><small>Promoção do dia</small><div style="display:flex;align-items:center;gap:8px;margin:6px 0 10px"><span class="bd '+st.cls+'">'+(st.cls==='ok'?'No ar':st.cls==='low'?'Agendada':st.cls==='out'?'Expirada':'Sem promoção')+'</span><span style="font-weight:600">'+esc(st.txt)+'</span></div>'+
    '<div class="foot" style="margin:0;flex-wrap:wrap"><button class="btn primary" data-act="promoEdit">'+(p&&p.nome?'Editar promoção':'Criar promoção do dia')+'</button>'+(p&&p.ativa?'<button class="btn ghost danger" data-act="promoOff">Não mostrar ao cliente</button>':(p&&p.nome?'<button class="btn ghost" data-act="promoOn">Mostrar ao cliente</button>':''))+'</div></div>';
}
function openPromo(){
  var p=CFG.promo||{},q={};
  (p.itens||[]).forEach(function(i){q[i.id]=i.qtd});
  var d={ativa:p.ativa!==false,nome:p.nome||'',desc:p.desc||'',preco:p.preco?String(p.preco).replace('.',','):'',data:p.data||dayKey(Date.now())};
  function normal(){return CFG.itens.reduce(function(s,i){return s+(q[i.id]||0)*i.preco},0)}
  function pv(){var n=normal(),pr=num(d.preco);return 'Valor normal dos itens: '+money(n)+(pr>0&&n>0?' · Promoção: '+money(pr)+(n>pr?' · Cliente economiza '+money(n-pr):''):'')}
  openSheet({
    data:d,
    onInput:function(k){if(k==='preco'){var e=$('#pv');if(e)e.textContent=pv()}},
    render:function(){
      var h='<div class="sh-head"><h3>Promoção do dia</h3></div>';
      h+='<div class="chips" style="margin-top:12px"><button class="chip '+(d.ativa?'on':'')+'" data-act="tAtiva" aria-pressed="'+d.ativa+'">'+(d.ativa?'✓ ':'')+'Mostrar para o cliente</button></div>';
      h+='<div class="fld"><label>Nome da promoção</label><input class="in" data-bind="nome" value="'+esc(d.nome)+'" placeholder="Ex.: Combo Big + Coca"></div>';
      h+='<div class="fld"><label>Descrição (opcional)</label><input class="in" data-bind="desc" value="'+esc(d.desc)+'" placeholder="Ex.: só hoje!"></div>';
      h+='<div class="fld"><label>Preço da promoção (R$)</label><input class="in" data-bind="preco" inputmode="decimal" value="'+esc(d.preco)+'" placeholder="0,00"></div>';
      h+='<div class="fld"><label>Vale no dia</label><input class="in" type="date" data-bind="data" value="'+esc(d.data)+'"></div>';
      h+='<h4>Itens da promoção</h4>';
      Object.keys(CAT).forEach(function(cat){
        var l=CFG.itens.filter(function(i){return i.cat===cat&&i.ativo!==false});
        if(!l.length)return;
        h+='<p class="sub" style="margin-top:8px">'+CAT[cat]+'</p>'+l.map(function(i){
          return '<div class="ex"><span>'+esc(i.nome)+'<small>'+money(i.preco)+'</small></span><div class="step"><button data-act="pq" data-id="'+esc(i.id)+'" data-d="-1" aria-label="Menos '+esc(i.nome)+'">−</button><b>'+(q[i.id]||0)+'</b><button data-act="pq" data-id="'+esc(i.id)+'" data-d="1" aria-label="Mais '+esc(i.nome)+'">+</button></div></div>';
        }).join('');
      });
      h+='<p id="pv" class="sub" style="margin-top:12px">'+pv()+'</p>';
      h+='<div class="foot" style="flex-wrap:wrap"><button class="btn primary" data-act="ok">Salvar</button><button class="btn ghost" data-act="okEnv">Salvar e enviar aos celulares</button></div>';
      return h;
    },
    act:{
      tAtiva:function(){d.ativa=!d.ativa;drawSheet()},
      pq:function(x){var n=Math.max(0,Math.min(9,(q[x.id]||0)+Number(x.d)));if(n)q[x.id]=n;else delete q[x.id];drawSheet()},
      ok:function(){if(salvar())toast('Promoção salva. O cliente só vê depois que você enviar aos celulares.')},
      okEnv:function(){if(salvar())openPublicar()}
    }
  });
  function salvar(){
    var pr=num(d.preco),itens=Object.keys(q).map(function(id){return {id:id,qtd:q[id]}});
    if(!d.nome.trim()){toast('Dê um nome à promoção');return false}
    if(!(pr>0)){toast('Informe o preço da promoção');return false}
    if(!itens.length){toast('Escolha pelo menos um item da promoção');return false}
    if(!d.data){toast('Escolha o dia da promoção');return false}
    CFG.promo={ativa:d.ativa,nome:d.nome.trim(),desc:d.desc.trim(),preco:Math.round(pr*100)/100,data:d.data,itens:itens};
    saveCfg();closeSheet();render();return true;
  }
}

function openItemEdit(id){
  var ex=id?CFG.itens.filter(function(i){return i.id===id})[0]:null;
  var d=ex?{nome:ex.nome,cat:ex.cat,preco:String(ex.preco).replace('.',','),desc:ex.desc||'',ativo:ex.ativo!==false}:{nome:'',cat:'lanche',preco:'',desc:'',ativo:true};
  openSheet({
    data:d,
    render:function(){
      return '<div class="sh-head"><h3>'+(ex?'Editar item':'Novo item')+'</h3></div>'+
       '<div class="fld"><label>Nome</label><input class="in" data-bind="nome" value="'+esc(d.nome)+'"></div>'+
       '<div class="fld"><label>Categoria</label><select class="in" data-bind="cat">'+Object.keys(CAT).map(function(k){return '<option value="'+k+'"'+(d.cat===k?' selected':'')+'>'+CAT[k]+'</option>'}).join('')+'</select></div>'+
       '<div class="fld"><label>Valor (R$)</label><input class="in" data-bind="preco" inputmode="decimal" value="'+esc(d.preco)+'" placeholder="0,00"></div>'+
       '<div class="fld"><label>Descrição (opcional)</label><input class="in" data-bind="desc" value="'+esc(d.desc)+'"></div>'+

    },
    act:{
      tAtivo:function(){d.ativo=!d.ativo;drawSheet()},
      ok:function(){
        var p=num(d.preco);
        if(!d.nome.trim()){toast('Informe o nome do item');return}
        if(!(p>0)){toast('Informe o valor do item');return}
        var o={nome:d.nome.trim(),cat:d.cat,preco:Math.round(p*100)/100,desc:d.desc.trim(),ativo:d.ativo};
        if(ex)Object.assign(ex,o);else CFG.itens.push(Object.assign({id:'i'+uid()},o));
        saveCfg();closeSheet();render();toast(ex?'Item atualizado':'Item criado');
      },
      del:function(){confirmSheet('Excluir “'+ex.nome+'” do cardápio? As vendas já feitas continuam registradas.','Excluir',function(){CFG.itens=CFG.itens.filter(function(i){return i.id!==ex.id});saveCfg();render();toast('Item excluído')},true)}
    }
  });
}
function openExtraEdit(id){
  var ex=id?CFG.extras.filter(function(i){return i.id===id})[0]:null;
  var d=ex?{nome:ex.nome,preco:String(ex.preco).replace('.',',')}:{nome:'',preco:''};
  openSheet({
    data:d,
    render:function(){
      return '<div class="sh-head"><h3>'+(ex?'Editar adicional':'Novo adicional')+'</h3></div>'+
       '<div class="fld"><label>Nome</label><input class="in" data-bind="nome" value="'+esc(d.nome)+'"></div>'+
       '<div class="fld"><label>Valor (R$)</label><input class="in" data-bind="preco" inputmode="decimal" value="'+esc(d.preco)+'" placeholder="0,00"></div>'+
       '<div class="foot">'+(ex?'<button class="btn ghost danger" data-act="del">Excluir</button>':'')+'<button class="btn primary" data-act="ok">Salvar</button></div>';
    },
    act:{
      ok:function(){
        var p=num(d.preco);
        if(!d.nome.trim()){toast('Informe o nome do adicional');return}
        if(!(p>0)){toast('Informe o valor');return}
        if(ex){ex.nome=d.nome.trim();ex.preco=Math.round(p*100)/100}else CFG.extras.push({id:'e'+uid(),nome:d.nome.trim(),preco:Math.round(p*100)/100});
        saveCfg();closeSheet();render();toast('Adicional salvo');

      del:function(){confirmSheet('Excluir o adicional “'+ex.nome+'”?','Excluir',function(){CFG.extras=CFG.extras.filter(function(i){return i.id!==ex.id});saveCfg();render();toast('Adicional excluído')},true)}
    }

  var mesa=por('mesa'),del=por('delivery');
  var formas={pix:0,cartao:0,dinheiro:0};
  vs.forEach(function(v){v.pagamentos.forEach(function(p){formas[p.forma]+=p.valor})});
  return {vs:vs,mesa:mesa,del:del,tMesa:sum(mesa,'total'),tDel:sum(del,'total'),taxas:sum(del,'taxa'),total:sum(vs,'total'),formas:formas};

/* ---------- relatórios para impressão ---------- */
function periodo(p){
  var ini,fim;
  if(p==='dia'){ini=fim=ui.dia}
  else if(p==='semana'){var d=new Date(ui.dia+'T12:00:00'),dow=(d.getDay()+6)%7;ini=addDays(ui.dia,-dow);fim=addDays(ini,6)}
  else{ini=ui.dia.slice(0,8)+'01';fim=fmtKey(new Date(Number(ui.dia.slice(0,4)),Number(ui.dia.slice(5,7)),0))}
  return {ini:ini,fim:fim};
}
function relFech(p,W){
  var pr=periodo(p),line=Array(W+1).join('-'),L=[],add=function(t){L.push(limpa(t))};
  var vs=todasVendas().filter(function(v){return v.dia>=pr.ini&&v.dia<=pr.fim});
  var por=function(t){return vs.filter(function(v){return v.tipo===t})},sum=function(l,k){return l.reduce(function(s,v){return s+v[k]},0)};
  var mesa=por('mesa'),del=por('delivery'),f={pix:0,cartao:0,dinheiro:0};
  vs.forEach(function(v){v.pagamentos.forEach(function(x){f[x.forma]+=x.valor})});
  add(ctr('NA BRASA BURGER',W));
  add(ctr({dia:'FECHAMENTO DO DIA',semana:'FECHAMENTO DA SEMANA',mes:'FECHAMENTO DO MES'}[p],W));
  add(ctr(p==='dia'?diaBr(pr.ini):diaBr(pr.ini)+' a '+diaBr(pr.fim),W));add(line);
  add(lr('TOTAL VENDIDO',money(sum(vs,'total')),W));add(line);
  add(lr('Mesas ('+mesa.length+')',money(sum(mesa,'total')),W));
  add(lr('Delivery ('+del.length+' saidas)',money(sum(del,'total')),W));
  add(lr('  taxas de entrega',money(sum(del,'taxa')),W));add(line);
  ['pix','cartao','dinheiro'].forEach(function(k){add(lr(FORMA[k],money(f[k]),W))});
  add(line);
  var sup=0,san=0,ab=0,dias=Object.keys(A.caixa).filter(function(k){return k>=pr.ini&&k<=pr.fim});
  dias.forEach(function(k){var c=A.caixa[k];ab+=c.abertura||0;(c.movs||[]).forEach(function(m){if(m.tipo==='suprimento')sup+=m.valor;else san+=m.valor})});
  if(p==='dia'){
    var ex=esperado(pr.ini,{formas:f});
    add(lr('Troco inicial',money(ex.ab),W));add(lr('Vendas em dinheiro',money(f.dinheiro),W));
    add(lr('Suprimentos',money(ex.sup),W));add(lr('Sangrias','- '+money(ex.san),W));
    add(lr('DEVERIA TER NA GAVETA',money(ex.esp),W));
    var fe=(A.caixa[pr.ini]||{}).fech;
    if(fe){add(lr('Contado',money(fe.contado),W));add(lr(fe.dif>=0?'Sobra':'Falta',money(Math.abs(fe.dif)),W))}
  }else{
    add(lr('Suprimentos',money(sup),W));add(lr('Sangrias','- '+money(san),W));
    add(line);add('POR DIA');
    var dd={};vs.forEach(function(v){(dd[v.dia]=dd[v.dia]||[]).push(v)});
    Object.keys(dd).sort().forEach(function(k){
      var l=dd[k],m=l.filter(function(v){return v.tipo==='mesa'}).length,e=l.length-m;
      add(lr(diaCurto(k)+' M'+m+' D'+e,money(sum(l,'total')),W));
    });
    if(!vs.length)add('Sem vendas no periodo.');
  }
  add('');add('');add('');
  return L.join('\n');
}
function relPed(tipo,W){
  var dia=ui.dia,line=Array(W+1).join('-'),L=[],add=function(t){L.push(limpa(t))};
  var vs=todasVendas().filter(function(v){return v.dia===dia&&v.tipo===tipo}).sort(function(a,b){return a.ts-b.ts});
  var sum=function(k){return vs.reduce(function(x,v){return x+v[k]},0)};
  add(ctr('NA BRASA BURGER',W));add(ctr(tipo==='mesa'?'PEDIDOS DE MESA':'PEDIDOS DE DELIVERY',W));add(ctr(diaBr(dia),W));add(line);
  if(!vs.length)add('Nenhum pedido neste dia.');
  vs.forEach(function(v){
    add(lr(hora(v.ts)+' '+(tipo==='mesa'?'MESA '+v.mesa:v.cliente),money(v.total),W));
    if(tipo==='delivery')wrapT(v.endereco+' - '+v.bairro,W-2).forEach(function(x){add('  '+x)});
    v.itens.forEach(function(i){wrapT(itemResumo(i),W-2).forEach(function(x){add('  '+x)})});
    if(tipo==='delivery')add('  Entrega '+money(v.taxa));
    var at=quemAtendeu(v);
    wrapT(formasTxt(v)+(at?' | '+at:''),W-2).forEach(function(x){add('  '+x)});
    add(line);
  });
  add(lr('TOTAL ('+vs.length+(tipo==='mesa'?(vs.length===1?' mesa)':' mesas)'):(vs.length===1?' saida)':' saidas)')),money(sum('total')),W));
  if(tipo==='delivery')add(lr('Taxas de entrega',money(sum('taxa')),W));
  var f={pix:0,cartao:0,dinheiro:0};
  vs.forEach(function(v){v.pagamentos.forEach(function(x){f[x.forma]+=x.valor})});
  ['pix','cartao','dinheiro'].forEach(function(k){add(lr(FORMA[k],money(f[k]),W))});
  add('');add('');add('');
  return L.join('\n');
}

var ACT={

  entrar:function(){
    var u=($('#lu').value||'').trim().toLowerCase(),p=$('#lp').value||'',c=cred();
    if(Date.now()<ui.bloq){erro('Muitas tentativas. Aguarde '+Math.ceil((ui.bloq-Date.now())/1000)+' segundos.');return}
    if(!u||!p){erro('Digite o usuário e a senha.');return}
    if(!temCripto()){erro('Este navegador não consegue validar a senha. Use o Chrome.');return}
    hashPw(c.salt,u,p).then(function(h){
      if(u===c.u&&h===c.h){
        ui.auth=true;ui.falhas=0;try{sessionStorage.setItem(K_SES,'1')}catch(e){}
        render();window.scrollTo(0,0);
      }else{
        ui.falhas++;
        if(ui.falhas>=5){ui.bloq=Date.now()+30000;ui.falhas=0;erro('Muitas tentativas. Aguarde 30 segundos.')}

  },
  sair:function(){ui.auth=false;try{sessionStorage.removeItem(K_SES)}catch(e){}render();window.scrollTo(0,0)},
  vendaDet:function(d){openVendaDet(d.id)},
  delVenda:function(d){var v=todasVendas().filter(function(x){return x.id===d.id})[0];if(v)excluirSheet(v)},
  restaurar:function(d){delete A.excluidos[d.id];saveA();render();toast('Pedido restaurado')},
  estEdit:function(d){openEst(d.k)},
  estRepetir:function(){
    var ant=A.est[addDays(ui.dia,-1)];
    if(!ant||!Object.keys(ant).length){toast('O dia anterior não tem totais');return}
    confirmSheet('Copiar os totais do dia anterior para '+diaBr(ui.dia)+'? Os totais atuais deste dia serão substituídos.','Copiar',function(){A.est[ui.dia]=clone(ant);saveA();render();toast('Totais copiados')});
  },
  estLimpar:function(){confirmSheet('Apagar os totais de estoque de '+diaBr(ui.dia)+'?','Apagar',function(){delete A.est[ui.dia];saveA();render();toast('Totais apagados')},true)},
  promoEdit:openPromo,
  promoOff:function(){if(CFG.promo){CFG.promo.ativa=false;saveCfg();render();toast('Promoção desligada. Envie aos celulares para o cliente deixar de ver.')}},
  promoOn:function(){if(CFG.promo){CFG.promo.ativa=true;saveCfg();render();toast('Promoção ligada. Envie aos celulares para o cliente ver.')}},
  itemNovo:function(){openItemEdit(null)},
  itemEdit:function(d){openItemEdit(d.id)},
  extraNovo:function(){openExtraEdit(null)},
  extraEdit:function(d){openExtraEdit(d.id)},
  publicar:openPublicar,
  abrir:function(){
    var v=num($('#ab').value);
    var cx=A.caixa[ui.dia]=A.caixa[ui.dia]||{};cx.abertura=Math.round(v*100)/100;cx.aberturaTs=Date.now();
    saveA();render();toast('Caixa aberto');
  },
  abrirEdit:function(){
    var d={v:String((A.caixa[ui.dia]||{}).abertura||'').replace('.',',')};
    openSheet({
      data:d,
      render:function(){return '<div class="sh-head"><h3>Troco inicial</h3></div><div class="fld"><label>Dinheiro inicial na gaveta (R$)</label><input class="in" data-bind="v" inputmode="decimal" value="'+esc(d.v)+'"></div><div class="foot"><button class="btn ghost" data-act="closeSheet">Cancelar</button><button class="btn primary" data-act="ok">Salvar</button></div>'},
      act:{ok:function(){var cx=A.caixa[ui.dia]=A.caixa[ui.dia]||{};cx.abertura=Math.round(num(d.v)*100)/100;saveA();closeSheet();render();toast('Troco inicial atualizado')}}
    });
  },
  mov:function(d){openMov(d.t)},
  movDel:function(d){
    var cx=A.caixa[ui.dia]||{},m=(cx.movs||[]).filter(function(x){return x.id===d.id})[0];if(!m)return;
    confirmSheet('Excluir esta '+(m.tipo==='sangria'?'sangria':'entrada')+' de '+money(m.valor)+'?','Excluir',function(){cx.movs=cx.movs.filter(function(x){return x.id!==m.id});saveA();render();toast('Excluído')},true);
  },
  fechar:function(){
    var r=resumoDia(ui.dia),ex=esperado(ui.dia,r),c=num($('#ct').value);
    if($('#ct').value.trim()===''){toast('Informe o dinheiro contado');return}
    var dif=Math.round((c-ex.esp)*100)/100;
    confirmSheet('Fechar o caixa de '+diaBr(ui.dia)+'? Contado '+money(c)+', esperado '+money(ex.esp)+'.','Fechar caixa',function(){
      var cx=A.caixa[ui.dia]=A.caixa[ui.dia]||{};
      cx.fech={ts:Date.now(),contado:c,esperado:ex.esp,dif:dif,total:r.total};
      saveA();render();toast('Caixa fechado');
    });
  },
  reabrir:function(){confirmSheet('Reabrir o caixa deste dia?','Reabrir',function(){delete (A.caixa[ui.dia]||{}).fech;saveA();render();toast('Caixa reaberto')})},
  impFech:function(d){var p=d.p;openPrintTexto({dia:'Fechamento do dia',semana:'Fechamento da semana',mes:'Fechamento do mês'}[p],function(W){return relFech(p,W)})},
  impPed:function(d){var t=d.t;openPrintTexto(t==='mesa'?'Pedidos de mesa do dia':'Pedidos de delivery do dia',function(W){return relPed(t,W)})},
  backup:function(){if(baixar('na-brasa-admin-backup-'+ui.dia+'.json',JSON.stringify({admin:A,cardapio:CFG})))toast('Backup baixado')},
  senha:openSenha
};
document.addEventListener('click',function(e){
  var b=e.target.closest('[data-act]');if(!b)return;
  var a=b.dataset.act;
  var fn=(sheetState&&sheetState.act&&sheetState.act[a])||ACT[a];
  if(fn)fn(b.dataset,b,e);
});
function onField(e){
  var t=e.target;
  if(t.dataset&&t.dataset.bind&&sheetState&&sheetState.data){sheetState.data[t.dataset.bind]=t.value;if(sheetState.onInput)sheetState.onInput(t.dataset.bind)}
}
document.addEventListener('keydown',function(e){
  if(e.key!=='Enter')return;
  var id=e.target.id;
  if(id==='lu'){e.preventDefault();$('#lp').focus()}
  else if(id==='lp'){e.preventDefault();ACT.entrar()}
});
document.addEventListener('input',onField);
document.addEventListener('change',function(e){
  onField(e);
  if(e.target.id==='imp'&&e.target.files&&e.target.files[0]){
    var rd2=new FileReader();
    rd2.onload=function(){
      try{
        var obj=JSON.parse(rd2.result);
        if(!obj||!Array.isArray(obj.vendas))throw new Error('x');
        var conhecidos={};todasVendas().forEach(function(v){conhecidos[v.id]=1});
        var novas=obj.vendas.filter(function(v){return v&&v.id&&v.dia&&Array.isArray(v.itens)&&Array.isArray(v.pagamentos)&&!conhecidos[v.id]});
        novas.forEach(function(v){A.importadas.push(v)});
        (Array.isArray(obj.cancelados)?obj.cancelados:[]).forEach(function(c){
          if(c&&c.id&&!A.excluidos[c.id])A.excluidos[c.id]={ts:c.cancelTs||Date.now(),motivo:c.motivo||'',por:c.cancelPor||'',venda:c,importado:true};
        });
        saveA();render();toast(novas.length+(novas.length===1?' venda importada':' vendas importadas'));
      }catch(err){toast('Arquivo de backup inválido')}
    };
    rd2.readAsText(e.target.files[0]);e.target.value='';
  }
});

render();
})();
</script>
</body>
</html>
