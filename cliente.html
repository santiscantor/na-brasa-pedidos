<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="theme-color" content="#120c0a">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Na Brasa Burger · Faça seu pedido</title>
<meta name="theme-color" content="#120c0a">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Alfa+Slab+One&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#fff4cf;--surface:#fffdf5;--ink:#1c1411;--muted:#6f6058;--line:#e8d9a8;--chip:#f6e7b0;
  --brand:#ffc400;--brand-ink:#1c1411;--fire:#d62828;--ok:#1b8a4b;--head:#120c0a;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--bg:#160f0c;--surface:#241a16;--ink:#fff1cf;--muted:#b9a58f;--line:#3a2b24;--chip:#33251f}
}
:root[data-theme="dark"]{--bg:#160f0c;--surface:#241a16;--ink:#fff1cf;--muted:#b9a58f;--line:#3a2b24;--chip:#33251f}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Barlow',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:16px;line-height:1.35;-webkit-tap-highlight-color:transparent}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
:focus-visible{outline:3px solid var(--fire);outline-offset:2px}
h1,h2,h3,h4,p{margin:0}
.disp{font-family:'Alfa Slab One',Georgia,serif;font-weight:400;letter-spacing:.2px}

/* cabeçalho */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--head);border-bottom:4px solid var(--brand);display:flex;align-items:center;gap:12px;padding:8px 14px}
.top img{width:46px;height:46px;border-radius:50%;flex:none}
.sair{margin-left:auto;color:var(--brand);border:1.5px solid var(--brand);border-radius:99px;padding:6px 12px;font-weight:700;font-size:14px;min-height:36px;white-space:nowrap}
.top .nm{font-family:'Alfa Slab One',Georgia,serif;color:var(--brand);font-size:20px;line-height:1}
.top .sb{color:#e9d9b6;font-size:13px;margin-top:3px}

.main{padding:16px 14px 120px;max-width:720px;margin:0 auto}
.main>h1{font-size:26px;font-family:'Alfa Slab One',Georgia,serif;font-weight:400}
.sub{color:var(--muted);font-size:14px;margin-top:2px}

/* navegação */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--head);display:flex;padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px));gap:6px;border-top:1px solid #000}
.nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 4px;border-radius:12px;color:#cdbb95;font-weight:600;font-size:13px;min-height:52px}
.nav button svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.nav button.on{background:var(--brand);color:var(--brand-ink)}

/* botões */
.btn{min-height:48px;padding:10px 16px;border-radius:12px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-align:center}
.btn.primary{background:var(--brand);color:var(--brand-ink)}
.btn.fire{background:var(--fire);color:#fff}
.btn.ghost{background:var(--chip);color:var(--ink)}
.btn.danger{color:var(--fire)}
.btn.block{width:100%}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn.sm{min-height:40px;padding:6px 12px;font-size:15px}

/* mesas */
.legend{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}
.pill{display:inline-flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--line);padding:6px 12px;border-radius:99px;font-weight:600;font-size:14px}
.dot{width:12px;height:12px;border-radius:50%;background:var(--ok)}
.dot.r{background:var(--fire)}
.mesas{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.mesa{aspect-ratio:1;border-radius:14px;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:2px}
.mesa b{font-family:'Alfa Slab One',Georgia,serif;font-weight:400;font-size:24px;line-height:1}
.mesa small{font-size:11px;font-weight:600;opacity:.95}
.mesa.free{background:var(--ok)}
.mesa.occ{background:var(--fire)}
@media (min-width:520px){.mesas{grid-template-columns:repeat(6,1fr)}}

/* pedido */
.otop{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.back{background:var(--chip);border-radius:12px;min-height:44px;padding:0 14px;font-weight:700}
.otop h1{font-family:'Alfa Slab One',Georgia,serif;font-weight:400;font-size:22px;line-height:1.1}
.seg{display:flex;background:var(--chip);border-radius:14px;padding:4px;gap:4px;margin-bottom:14px}
.seg button{flex:1;min-height:44px;border-radius:11px;font-weight:700}
.seg button.on{background:var(--brand);color:var(--brand-ink)}
.cnt{display:inline-block;min-width:22px;padding:0 6px;border-radius:99px;background:var(--fire);color:#fff;font-size:13px;margin-left:4px}
.grp{font-family:'Alfa Slab One',Georgia,serif;font-weight:400;font-size:17px;margin:16px 0 8px}
.prod{width:100%;text-align:left;display:flex;align-items:center;gap:12px;background:var(--surface);border:1.5px solid var(--line);border-radius:14px;padding:12px;margin-bottom:8px}
.prod .n{font-family:'Alfa Slab One',Georgia,serif;font-size:20px;color:var(--fire);width:30px;flex:none;text-align:center}
.prod .i{flex:1;min-width:0}
.prod .i b{display:block;font-size:18px}
.prod .i span{display:block;font-size:13px;color:var(--muted);margin-top:2px}
.prod .p{font-weight:700;font-size:17px;white-space:nowrap;background:var(--brand);color:var(--brand-ink);padding:6px 10px;border-radius:10px}
.line{width:100%;text-align:left;display:flex;gap:10px;background:var(--surface);border:1.5px solid var(--line);border-radius:14px;padding:12px;margin-bottom:8px}
.line .q{font-weight:700;min-width:30px}
.line .i{flex:1;min-width:0}
.line .i b{display:block}
.line .i span{display:block;font-size:13px;color:var(--muted)}
.line .v{font-weight:700;white-space:nowrap}
.sum{background:var(--surface);border:1.5px solid var(--line);border-radius:14px;padding:12px;margin-top:12px}
.sum div{display:flex;justify-content:space-between;padding:4px 0}
.sum .tt{border-top:1.5px dashed var(--line);margin-top:6px;padding-top:10px;font-family:'Alfa Slab One',Georgia,serif;font-size:20px}
.obar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--head);color:#fff;display:flex;align-items:center;gap:12px;padding:10px 14px calc(10px + env(safe-area-inset-bottom,0px))}
.obar .t{flex:1}
.obar small{display:block;color:#cdbb95;font-size:13px}
.obar b{font-family:'Alfa Slab One',Georgia,serif;font-weight:400;font-size:22px;color:var(--brand)}
.empty{text-align:center;color:var(--muted);padding:28px 10px;border:2px dashed var(--line);border-radius:14px}

/* delivery */
.srow{display:flex;gap:8px;margin:14px 0}
.in{width:100%;min-height:48px;border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:8px 12px}
.srow .in{flex:1}
.card{background:var(--surface);border:1.5px solid var(--line);border-radius:14px;padding:12px;margin-bottom:10px}
.card h3{font-size:18px}
.card .ad{color:var(--muted);font-size:14px;margin-top:2px}
.card .ult{font-size:13px;margin-top:8px;padding:8px 10px;background:var(--chip);border-radius:10px}
.card .acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.tag{display:inline-block;background:var(--fire);color:#fff;font-size:12px;font-weight:700;padding:2px 8px;border-radius:99px;margin-left:6px;vertical-align:middle}
.taxa{display:inline-block;background:var(--brand);color:var(--brand-ink);font-size:12px;font-weight:700;padding:2px 8px;border-radius:99px}

/* caixa */
.dnav{display:flex;align-items:center;gap:8px;margin:12px 0}
.dnav .d{flex:1;text-align:center;font-weight:700;text-transform:capitalize}
.hero{background:var(--head);color:#fff;border-radius:18px;padding:16px;margin-bottom:12px;border-bottom:5px solid var(--brand)}
.hero small{color:#cdbb95}
.hero .big{font-family:'Alfa Slab One',Georgia,serif;font-size:38px;color:var(--brand);line-height:1.1;margin-top:4px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
.box{background:var(--surface);border:1.5px solid var(--line);border-radius:14px;padding:12px}
.box small{color:var(--muted);display:block}
.box b{font-family:'Alfa Slab One',Georgia,serif;font-weight:400;font-size:20px;display:block;margin-top:2px}
.box p{font-size:13px;color:var(--muted);margin-top:2px}
.kv{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line)}
.kv:last-child{border-bottom:0}
.row{width:100%;display:flex;align-items:center;gap:10px;text-align:left;background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:6px}
.row .t{font-weight:700;color:var(--muted);width:46px;flex:none}
.row .w{flex:1;min-width:0}
.row .w b{display:block}
.row .w small{display:block;color:var(--muted)}
.row .v{font-weight:700;white-space:nowrap}
.warn{background:#ffe0dc;color:#7a1410;border-radius:12px;padding:10px 12px;margin-bottom:10px;font-weight:600}
.okb{background:#d9f3e2;color:#0e5a2e;border-radius:12px;padding:10px 12px;margin-bottom:10px;font-weight:600}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .warn{background:#4a1c18;color:#ffd9d4}:root:not([data-theme="light"]) .okb{background:#15382a;color:#c8f0d8}}
:root[data-theme="dark"] .warn{background:#4a1c18;color:#ffd9d4}
:root[data-theme="dark"] .okb{background:#15382a;color:#c8f0d8}
.lock{max-width:340px;margin:40px auto;text-align:center;display:grid;gap:12px}

/* sheet */
#sheet{position:fixed;inset:0;z-index:50}
.scrim{position:absolute;inset:0;background:rgba(0,0,0,.6)}
.panel{position:absolute;left:0;right:0;bottom:0;max-height:92%;overflow:auto;background:var(--bg);border-radius:22px 22px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px));max-width:720px;margin:0 auto}
.panel h4{font-family:'Alfa Slab One',Georgia,serif;font-weight:400;font-size:16px;margin:16px 0 8px}
.sh-head{display:flex;justify-content:space-between;align-items:center;gap:10px}
.sh-head h3{font-family:'Alfa Slab One',Georgia,serif;font-weight:400;font-size:22px}
.sh-head .price{font-weight:700;background:var(--brand);color:var(--brand-ink);padding:4px 10px;border-radius:10px}
.qty,.ex{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 0}
.ex small{display:block;color:var(--muted)}
.step{display:flex;align-items:center;gap:10px}
.step button{width:44px;height:44px;border-radius:12px;background:var(--chip);font-size:24px;font-weight:700}
.step b{min-width:24px;text-align:center;font-size:18px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:44px;padding:0 14px;border-radius:99px;background:var(--surface);border:1.5px solid var(--line);font-weight:600}
.chip.on{background:var(--fire);border-color:var(--fire);color:#fff}
.opt{flex:1;min-height:48px;border-radius:12px;background:var(--surface);border:1.5px solid var(--line);font-weight:700}
.opt.on{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.opts{display:flex;gap:8px}
.opt[disabled]{opacity:.4;cursor:not-allowed}
.foot{display:flex;gap:10px;margin-top:18px}
.foot .btn{flex:1}
.fld{display:grid;gap:4px;margin-top:12px}
.fld label{font-weight:600;font-size:14px}
.tot{font-family:'Alfa Slab One',Georgia,serif;font-size:30px;color:var(--fire);margin:6px 0}
.mh{margin:14px 0 6px;display:flex;justify-content:space-between;font-weight:700;text-transform:capitalize}
textarea.in{min-height:180px;font-size:14px}

#toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%) translateY(20px);background:#000;color:#fff;padding:10px 16px;border-radius:12px;z-index:60;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;max-width:88%;text-align:center;font-weight:600}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
@media (prefers-reduced-motion:reduce){#toast{transition:none}}

/* cliente */
.hero{background:radial-gradient(120% 100% at 50% 0%,#4a1712 0%,#1a0f0c 55%,#120c0a 100%);color:#fff;text-align:center;padding:calc(14px + env(safe-area-inset-top,0px)) 16px 16px;border-bottom:4px solid var(--brand)}
.hero img{display:block;width:min(64vw,250px);height:auto;margin:0 auto;filter:drop-shadow(0 6px 14px rgba(0,0,0,.5))}
.hero p{color:#f0dfb8;margin-top:6px;font-size:14px;font-weight:600;letter-spacing:.3px}
.top img.mini{border-radius:8px;width:52px;height:auto}
.catnav{position:sticky;top:0;z-index:15;display:flex;gap:8px;padding:10px 14px;background:var(--bg);border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
.catnav::-webkit-scrollbar{display:none}
.catnav button{flex:none;padding:8px 18px;border-radius:99px;background:var(--surface);border:1.5px solid var(--line);font-weight:700;min-height:40px}
.catnav button:active{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.hi{font-size:17px;margin-bottom:4px}
.grp{scroll-margin-top:64px}
.promo{background:linear-gradient(135deg,#e13030 0%,#a01010 100%);color:#fff;border-radius:20px;padding:16px;margin:14px 0 6px;box-shadow:0 8px 22px rgba(214,40,40,.38);border:2px solid #ffc400;scroll-margin-top:64px}
.promo .tag{display:inline-block;background:var(--brand);color:#1c1411;font-weight:800;letter-spacing:.6px;font-size:12px;padding:4px 12px;border-radius:99px}
.promo h2{font-family:'Alfa Slab One',Georgia,serif;font-weight:400;font-size:26px;margin-top:10px;line-height:1.1}
.promo p{margin-top:6px;font-size:15px;opacity:.96}
.promo .inc{font-weight:600}
.promo .pr{display:flex;align-items:baseline;gap:8px;margin:12px 0 14px;flex-wrap:wrap}
.promo .de{text-decoration:line-through;opacity:.85;font-size:16px}
.promo .por-l{opacity:.9}
.promo .por{font-family:'Alfa Slab One',Georgia,serif;font-size:38px;color:var(--brand);line-height:1}
.promo .btn{width:100%;min-height:54px;font-size:18px;background:var(--brand);color:#1c1411;box-shadow:0 3px 0 rgba(0,0,0,.25)}
.quick{display:flex;gap:8px;align-items:center;background:var(--surface);border:1.5px solid var(--line);border-radius:14px;padding:12px;margin-bottom:8px}
.quick .q1{flex:1;min-width:0}
.quick b{display:block}
.quick span{display:-webkit-box;font-size:13px;color:var(--muted);overflow:hidden;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.prod{border-radius:16px;box-shadow:0 2px 0 rgba(0,0,0,.05)}
.prod .p{border-radius:12px;font-size:16px}
.pixbox{background:var(--surface);border:2px dashed var(--fire);border-radius:16px;padding:14px;margin-top:12px}
.pixbox small{color:var(--muted);font-weight:600}
.pixbox .k{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:24px;font-weight:700;letter-spacing:1px;margin-top:2px}
.prev{width:100%;max-height:320px;object-fit:contain;border-radius:12px;margin-top:12px;background:var(--chip)}
.main{padding-bottom:130px}
</style>
</head>
<body>
<div id="app"></div>
<div id="sheet" hidden></div>
<div id="toast" role="status" aria-live="polite"></div>

var GRUPOS=[['lanche','Lanches'],['porcao','Batatas'],['bebida','Bebidas']];
function promoAtual(){
  var p=cfgAtual&&cfgAtual.promo;
  if(!p||!p.ativa||!p.nome||!(Number(p.preco)>0)||!Array.isArray(p.itens)||!p.itens.length)return null;
  if(p.data&&p.data!==hojeKey())return null;
  var comp=[],normal=0;
  for(var i=0;i<p.itens.length;i++){
    var m=MENU.filter(function(x){return x.id===p.itens[i].id})[0];
    if(!m)return null;
    var q=Math.max(1,Math.round(Number(p.itens[i].qtd)||1));
    comp.push({id:m.id,nome:m.nome,cat:m.cat,qtd:q});normal+=m.preco*q;
  }
  return {p:p,comp:comp,normal:normal,preco:Number(p.preco)};
}

/* ---------- utilitários ---------- */
function $(s){return document.querySelector(s)}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function money(n){var p=(Math.round(n*100)/100).toFixed(2).split('.');return 'R$ '+p[0].replace(/\B(?=(\d{3})+(?!\d))/g,'.')+','+p[1]}
function clone(o){return JSON.parse(JSON.stringify(o))}
function num(s){var n=parseFloat(String(s).replace(',','.'));return isNaN(n)?0:n}
function pad(n){return (n<10?'0':'')+n}
function dataHora(ts){var d=new Date(ts);return pad(d.getDate())+'/'+pad(d.getMonth()+1)+' '+pad(d.getHours())+':'+pad(d.getMinutes())}
function taxaDe(b){for(var i=0;i<BAIRROS.length;i++){if(BAIRROS[i][0]===b)return BAIRROS[i][1]}return 0}
function rd(k){try{var r=localStorage.getItem(k);return r?JSON.parse(r):null}catch(e){return null}}
function fmtCpf(c){return String(c).replace(/\D/g,'').replace(/^(\d{3})(\d{3})(\d{3})(\d{2})$/,'$1.$2.$3-$4')}
function fmtKey(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function hojeKey(){return fmtKey(new Date(Date.now()-6*3600*1000))}
function copiar(t,msg){
  function fim(ok){toast(ok?msg:'Não consegui copiar. Segure sobre o número para copiar.')}
  function legado(){var ta=document.createElement('textarea');ta.value=t;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.focus();ta.select();var ok=false;try{ok=document.execCommand('copy')}catch(e){}ta.remove();fim(ok)}
  try{if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(t).then(function(){fim(true)},legado);return}}catch(e){}
  legado();
}
var tt;
function toast(m){var t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(tt);tt=setTimeout(function(){t.classList.remove('show')},2800)}

function aplicaCfg(c){
  MENU=(c.itens||[]).filter(function(i){return i.ativo!==false}).map(function(i){return {id:i.id,nome:i.nome,preco:Number(i.preco)||0,cat:i.cat,desc:i.desc||''}});
  EXTRAS=(c.extras||[]).map(function(e){return {id:e.id,nome:e.nome,preco:Number(e.preco)||0}});
}

function unitPrice(i){return i.preco+(i.extras||[]).reduce(function(s,e){return s+e.preco*e.qtd},0)}
function lineTotal(i){return unitPrice(i)*i.qtd}
function subtotalDe(l){return l.reduce(function(s,i){return s+lineTotal(i)},0)}
function cartQtd(){return C.cart.reduce(function(s,i){return s+i.qtd},0)}
function itemResumo(i){
  var t=i.qtd+'x '+i.nome;
  if(i.sem&&i.sem.length)t+=' (sem '+i.sem.map(function(x){return x.toLowerCase()}).join(', ')+')';
  if(i.extras&&i.extras.length)t+=' + '+i.extras.map(function(e){return (e.qtd>1?e.qtd+'x ':'')+e.nome.toLowerCase()}).join(', ');
  return t;
}
function resumo(itens){return itens.map(itemResumo).join(' · ')}

/* refaz um pedido antigo com os preços e itens de hoje */
function recotar(itens){
  var out=[],perdidos=0;
  itens.forEach(function(l){
    var m=MENU.filter(function(x){return x.id===l.id})[0];
    if(!m){perdidos++;return}
    var ex=[];
    (l.extras||[]).forEach(function(e){var x=EXTRAS.filter(function(y){return y.id===e.id})[0];if(x)ex.push({id:x.id,nome:x.nome,preco:x.preco,qtd:e.qtd})});
    out.push({id:m.id,nome:m.nome,preco:m.preco,cat:m.cat,lanche:m.cat==='lanche',qtd:l.qtd,sem:(l.sem||[]).slice(),extras:ex,obs:l.obs||''});
  });
  return {itens:out,perdidos:perdidos};
}

/* ---------- sheets ---------- */
function openSheet(o){sheetState=o;drawSheet()}
function drawSheet(){
  var el=$('#sheet');
  if(!sheetState){el.hidden=true;el.innerHTML='';document.body.style.overflow='';return}
  el.hidden=false;document.body.style.overflow='hidden';
  el.innerHTML='<div class="scrim" data-act="closeSheet"></div><div class="panel" role="dialog" aria-modal="true">'+sheetState.render()+'</div>';
}
function closeSheet(){sheetState=null;drawSheet()}
function confirmSheet(msg,label,fn,danger){
  openSheet({
    render:function(){return '<div class="sh-head"><h3>Confirmar</h3></div><p style="margin-top:10px">'+esc(msg)+'</p><div class="foot"><button class="btn ghost" data-act="closeSheet">Cancelar</button><button class="btn '+(danger?'fire':'primary')+'" data-act="cok">'+esc(label)+'</button></div>'},
    act:{cok:function(){closeSheet();fn()}}
  });
}
function openItem(m,idx){
  var editing=idx!=null;
  var cur=editing?clone(C.cart[idx]):{id:m.id,nome:m.nome,preco:m.preco,cat:m.cat,lanche:m.cat==='lanche',qtd:1,sem:[],extras:[],obs:''};
  function exQ(id){var e=cur.extras.filter(function(x){return x.id===id})[0];return e?e.qtd:0}
  openSheet({
    data:cur,
    render:function(){
      var h='<div class="sh-head"><h3>'+esc(cur.nome)+'</h3><span class="price">'+money(cur.preco)+'</span></div>';
      h+='<div class="qty"><span>Quantidade</span><div class="step"><button data-act="q" data-d="-1" aria-label="Diminuir">−</button><b>'+cur.qtd+'</b><button data-act="q" data-d="1" aria-label="Aumentar">+</button></div></div>';
      if(cur.lanche){
        h+='<h4>Retirar</h4><div class="chips">'+REMOVER.map(function(r){return '<button class="chip '+(cur.sem.indexOf(r)>=0?'on':'')+'" data-act="sem" data-v="'+r+'" aria-pressed="'+(cur.sem.indexOf(r)>=0)+'">Sem '+r.toLowerCase()+'</button>'}).join('')+'</div>';
        h+='<h4>Adicionais</h4>'+EXTRAS.map(function(x){return '<div class="ex"><span>'+esc(x.nome)+'<small>+ '+money(x.preco)+'</small></span><div class="step"><button data-act="ex" data-id="'+esc(x.id)+'" data-d="-1" aria-label="Menos '+esc(x.nome)+'">−</button><b>'+exQ(x.id)+'</b><button data-act="ex" data-id="'+esc(x.id)+'" data-d="1" aria-label="Mais '+esc(x.nome)+'">+</button></div></div>'}).join('');
      }
      h+='<h4>Observação</h4><input class="in" data-bind="obs" value="'+esc(cur.obs)+'" placeholder="Ex.: ponto da carne, molho à parte">';
      h+='<div class="foot">'+(editing?'<button class="btn ghost danger" data-act="del">Remover</button>':'')+'<button class="btn primary" data-act="ok">'+(editing?'Salvar':'Adicionar')+' · '+money(unitPrice(cur)*cur.qtd)+'</button></div>';
      return h;
    },
    act:{
      q:function(d){cur.qtd=Math.max(1,Math.min(50,cur.qtd+Number(d.d)));drawSheet()},
      sem:function(d){var i=cur.sem.indexOf(d.v);if(i>=0)cur.sem.splice(i,1);else cur.sem.push(d.v);drawSheet()},
      ex:function(d){
        var x=EXTRAS.filter(function(e){return e.id===d.id})[0],e=cur.extras.filter(function(y){return y.id===d.id})[0];
        if(!x)return;
        if(!e){e={id:x.id,nome:x.nome,preco:x.preco,qtd:0};cur.extras.push(e)}
        e.qtd=Math.max(0,Math.min(9,e.qtd+Number(d.d)));
        if(!e.qtd)cur.extras=cur.extras.filter(function(y){return y.id!==d.id});
        drawSheet();
      },
      del:function(){C.cart.splice(idx,1);save();closeSheet();render();toast('Item removido')},
      ok:function(){
        if(editing)C.cart[idx]=cur;else C.cart.push(cur);
        save();closeSheet();render();toast(editing?'Item atualizado':cur.nome+' adicionado');
      }
    }
  });
}

      var h='<div class="sh-head"><h3>Meus pedidos</h3></div><div style="margin-top:10px">';
      h+=C.pedidos.map(function(p,ix){
        return '<div class="card" style="margin-bottom:8px"><p class="sub">'+dataHora(p.ts)+' · '+esc(p.id)+'</p><p style="margin-top:4px">'+esc(resumo(p.itens))+'</p><p style="margin-top:4px"><b>'+money(p.total)+'</b> <span class="sub">('+esc(FORMA[p.pag.f]||'')+')</span></p><div class="acts"><button class="btn primary sm" data-act="hRep" data-i="'+ix+'">Repetir</button><button class="btn ghost sm" data-act="hFav" data-i="'+ix+'">★ Favoritar</button>'+(p.pag.f==='pix'?'<button class="btn ghost sm" data-act="hComp" data-i="'+ix+'">Comprovante</button>':'')+'</div></div>';
      }).join('');
      return h+'</div><div class="foot"><button class="btn primary" data-act="closeSheet">Fechar</button></div>';
    },
    act:{
      hRep:function(d){var p=C.pedidos[Number(d.i)];closeSheet();repetir(p.itens)},
      hFav:function(d){var p=C.pedidos[Number(d.i)];openFavNome(p.itens,p.itens[0]?p.itens[0].nome:'')},
      hComp:function(d){openComprovante(C.pedidos[Number(d.i)])}
    }
  });
}

/* ---------- pedido para o WhatsApp ---------- */
function montarMsg(p){
  var L=[];
  L.push('*NOVO PEDIDO - NA BRASA BURGER*');
  L.push('Pedido: '+p.id);L.push('');
  L.push('*Cliente:* '+p.cli.nome);
  L.push('*Endereço:* '+p.cli.rua+', '+p.cli.numero+' - '+p.cli.bairro);
  if(p.cli.ref)L.push('*Referência:* '+p.cli.ref);
  L.push('');L.push('*Itens*');
  p.itens.forEach(function(i){
    var t='• '+itemResumo(i)+' — '+money(lineTotal(i));
    L.push(t);
    if(i.comp&&i.comp.length)L.push('   Inclui: '+i.comp.map(function(c){return c.qtd+'x '+c.nome}).join(', '));
    if(i.obs)L.push('   Obs.: '+i.obs);
  });
  L.push('');
  L.push('Produtos: '+money(p.subtotal));
  L.push('Entrega ('+p.cli.bairro+'): '+money(p.taxa));
  L.push('*TOTAL: '+money(p.total)+'*');
  L.push('');
  var pg='*Pagamento:* '+(p.pag.f==='pix'?'Pix (vou enviar o comprovante)':p.pag.f==='cartao'?'Cartão na entrega':'Dinheiro'+(p.pag.troco>0?' (troco para '+money(p.pag.troco)+')':''));
  L.push(pg);L.push('');
  L.push('Código para o sistema: '+codigo(p));
  return L.join('\n');
}
/* código legível pelo app de pedidos da loja (não apagar esta linha) */
function codigo(p){
  var j={v:1,c:p.id,n:p.cli.nome,ru:p.cli.rua,nu:p.cli.numero,b:p.cli.bairro,r:p.cli.ref||'',p:p.pag.f,t:p.pag.troco||0,
    it:p.itens.map(function(i){return {i:i.id,n:i.nome,p:i.preco,q:i.qtd,k:i.promo?'promo':(i.cat||(i.lanche?'lanche':'porcao')),c:(i.comp||[]).map(function(c){return {i:c.id,n:c.nome,k:c.cat,q:c.qtd}}),s:i.sem||[],o:i.obs||'',e:(i.extras||[]).map(function(e){return {i:e.id,n:e.nome,p:e.preco,q:e.qtd}})}})};
  return '#NB1#'+btoa(unescape(encodeURIComponent(JSON.stringify(j))))+'#';
}
function urlZap(texto){return 'https://wa.me/'+ZAP+'?text='+encodeURIComponent(texto)}
function enviar(){
  var p=C.perfil;
  if(!C.cart.length){toast('Seu pedido está vazio');return}
  if(!p.nome.trim()){toast('Informe seu nome');var a=$('#cnome');if(a)a.focus();return}
  if(!p.bairro){toast('Escolha o bairro');var b=$('#cbairro');if(b)b.focus();return}
  if(!p.rua.trim()){toast('Informe a rua');var c=$('#crua');if(c)c.focus();return}
  if(!String(p.numero).trim()){toast('Informe o número da casa');var d=$('#cnum');if(d)d.focus();return}
  var sub=subtotalDe(C.cart),taxa=taxaDe(p.bairro),total=sub+taxa,troco=C.pag==='dinheiro'?num(C.troco):0;
  if(troco>0&&troco<total){toast('O troco deve ser para um valor maior que '+money(total));return}
  var ped={id:'NB-'+Math.random().toString(36).slice(2,6).toUpperCase(),ts:Date.now(),itens:clone(C.cart),subtotal:sub,taxa:taxa,total:total,pag:{f:C.pag,troco:troco},
    cli:{nome:p.nome.trim(),rua:p.rua.trim(),numero:String(p.numero).trim(),bairro:p.bairro,ref:(p.ref||'').trim()}};
  ui.pend=ped;
  var url=urlZap(montarMsg(ped));
  var w=null;try{w=window.open(url,'_blank')}catch(e){}
  if(!w)window.location.href=url;
  abrirEnviado();
}
function abrirEnviado(){
  var p=ui.pend;
  openSheet({
    render:function(){
      var h='<div class="sh-head"><h3>Falta só um passo</h3></div><p style="margin-top:10px">O WhatsApp abriu com o seu pedido pronto. <b>Toque em enviar</b> lá para concluir. Código do pedido: <b>'+esc(p.id)+'</b>.</p>';
      if(p.pag.f==='pix')h+=pixBox(p.total)+'<button class="btn ghost block" style="margin-top:10px" data-act="comp">Já paguei: enviar foto do comprovante</button>';
      h+='<div class="foot" style="flex-wrap:wrap"><a class="btn ghost" href="'+esc(urlZap(montarMsg(p)))+'" target="_blank" rel="noopener">Abrir WhatsApp de novo</a><button class="btn ghost" data-act="favFim">★ Favoritar</button></div>';
      h+='<div class="foot"><button class="btn ghost" data-act="voltarEd">Voltar e editar</button><button class="btn primary" data-act="enviei">Já enviei</button></div>';
      return h;
    },
    act:{
      comp:function(){openComprovante(p)},
      favFim:function(){openFavNome(p.itens,p.itens[0]?p.itens[0].nome:'')},
      voltarEd:function(){closeSheet()},
      enviei:function(){
        C.pedidos.unshift(p);C.pedidos=C.pedidos.slice(0,20);C.cart=[];ui.tela='home';ui.pend=null;
        save();closeSheet();render();window.scrollTo(0,0);toast('Obrigado! Pedido '+p.id+' registrado');
      }
    }
  });
}
function openComprovante(p){
  var d={file:null,url:''};
  var texto='Comprovante do pedido '+p.id+' - '+p.cli.nome;
  openSheet({
    data:d,
    setFile:function(f){if(!f)return;if(d.url)try{URL.revokeObjectURL(d.url)}catch(e){}d.file=f;d.url=URL.createObjectURL(f);drawSheet()},
    render:function(){
      var h='<div class="sh-head"><h3>Comprovante do Pix</h3></div><p class="sub" style="margin-top:6px">Pedido '+esc(p.id)+' · '+money(p.total)+'</p>';
      if(d.file)h+='<img class="prev" src="'+d.url+'" alt="Foto do comprovante escolhida">';
      h+='<div class="foot" style="flex-wrap:wrap"><label class="btn '+(d.file?'ghost':'primary')+'" style="flex:1">'+(d.file?'Trocar foto':'Tirar ou escolher foto')+'<input id="cfoto" type="file" accept="image/*" hidden></label>'+(d.file?'<button class="btn primary" data-act="sendc">Enviar comprovante</button>':'')+'</div>';
      h+='<p class="sub" style="margin-top:10px">Ao tocar em enviar, escolha o WhatsApp e depois o contato da Na Brasa Burger, (19) 99725-6729. Se o seu celular não abrir essa opção, o WhatsApp será aberto para você anexar a foto pelo ícone do clipe.</p>';
      return h;
    },
    act:{sendc:function(){
      try{
        if(navigator.canShare&&navigator.canShare({files:[d.file]})){navigator.share({files:[d.file],text:texto}).catch(function(){});return}
      }catch(e){}
      var w=null;try{w=window.open(urlZap(texto),'_blank')}catch(e){}
      if(!w)window.location.href=urlZap(texto);
      toast('No WhatsApp, toque no clipe e anexe a foto do comprovante');
    }}
  });
}
function repetir(itens){
  var r=recotar(itens);
  if(!r.itens.length){toast('Esses itens não estão mais no cardápio');return}
  C.cart=r.itens;save();ui.tela='checkout';render();window.scrollTo(0,0);
  toast(r.perdidos?r.perdidos+(r.perdidos===1?' item saiu do cardápio e foi removido':' itens saíram do cardápio e foram removidos'):'Pedido carregado. Confira e envie');
}

/* ---------- ações ---------- */
var ACT={
  closeSheet:closeSheet,
  add:function(d){var m=MENU.filter(function(x){return x.id===d.id})[0];if(!m)return;
    if(m.cat==='lanche')openItem(m);
    else{
      var ex=C.cart.filter(function(l){return l.id===m.id&&!l.sem.length&&!l.extras.length&&!l.obs&&!l.lanche})[0];
      if(ex)ex.qtd=Math.min(50,ex.qtd+1);else C.cart.push({id:m.id,nome:m.nome,preco:m.preco,cat:m.cat,lanche:false,qtd:1,sem:[],extras:[],obs:''});
      save();render();toast(m.nome+' adicionado');
    }},
  promo:function(){
    var pr=promoAtual();if(!pr){toast('Essa promoção não está mais disponível');render();return}
    C.cart=C.cart.filter(function(l){return !l.promo});
    C.cart.unshift({id:'promo-'+(pr.p.data||'dia'),nome:'Promoção: '+pr.p.nome,preco:pr.preco,cat:'promo',lanche:false,promo:true,comp:pr.comp,qtd:1,sem:[],extras:[],obs:''});
    save();ui.tela='checkout';render();window.scrollTo(0,0);toast('Promoção adicionada. Confira e envie');
  },
  ir:function(d){var el=document.getElementById(d.s);if(el&&el.scrollIntoView)el.scrollIntoView({behavior:'smooth',block:'start'})},
  copiarPix:function(){copiar(String(PIX_CHAVE).replace(/\D/g,''),'Chave Pix copiada. Cole no app do seu banco')},
  ver:function(){ui.tela='checkout';render();window.scrollTo(0,0)},
  voltar:function(){ui.tela='home';render();window.scrollTo(0,0)},
  editar:function(d){var i=Number(d.i),l=C.cart[i];if(!l)return;if(l.promo){openPromoLinha(i);return}var m=MENU.filter(function(x){return x.id===l.id})[0]||{id:l.id,nome:l.nome,preco:l.preco,cat:l.cat};openItem(m,i)},
  pag:function(d){C.pag=d.f;save();render()},
  enviar:enviar,
  ultimo:function(){if(C.pedidos[0])repetir(C.pedidos[0].itens)},
  favPedir:function(d){var f=C.favs.filter(function(x){return x.id===d.id})[0];if(f)repetir(f.itens)},
  favDel:function(d){var f=C.favs.filter(function(x){return x.id===d.id})[0];if(!f)return;confirmSheet('Remover “'+f.nome+'” dos favoritos?','Remover',function(){C.favs=C.favs.filter(function(x){return x.id!==d.id});save();render();toast('Favorito removido')},true)},
  favSalvar:function(){if(C.cart.length)openFavNome(C.cart,C.cart[0].nome)},
  hist:openHist
};
document.addEventListener('click',function(e){
  var b=e.target.closest('[data-act]');if(!b)return;
  var a=b.dataset.act;
  var fn=(sheetState&&sheetState.act&&sheetState.act[a])||ACT[a];
  if(fn)fn(b.dataset,b,e);
});
function onField(e){
  var t=e.target;
  if(t.dataset&&t.dataset.bind&&sheetState&&sheetState.data){sheetState.data[t.dataset.bind]=t.value}
  if(t.dataset&&t.dataset.pf){
    var k=t.dataset.pf;
    if(k==='troco')C.troco=t.value;else C.perfil[k]=t.value;
    save();
    if(k==='bairro'){var r=$('#resumo');if(r)r.innerHTML=resumoHtml()}
  }
}
document.addEventListener('input',onField);
document.addEventListener('change',function(e){
  onField(e);
  if(e.target.id==='cfoto'&&sheetState&&sheetState.setFile&&e.target.files&&e.target.files[0])sheetState.setFile(e.target.files[0]);
});

render();
/* cardápio atualizado pela loja (cardapio.json, publicado junto do app) */
try{
  fetch('cardapio.json',{cache:'no-store'}).then(function(r){return r.ok?r.json():null}).then(function(j){
    if(j&&j.itens&&j.v>(cfgAtual.v||0)){
      cfgAtual=j;try{localStorage.setItem(K_MENU,JSON.stringify(j))}catch(e){}
      aplicaCfg(j);if(!sheetState)render();
    }
  }).catch(function(){});
}catch(e){}
})();
</script>
